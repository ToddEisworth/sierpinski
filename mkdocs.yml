site_name: Sierpinski Notes
site_url: https://YOUR-GITHUB-USERNAME.github.io/sierpinski/

theme:
  name: material

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.arithmatex:
      generic: true

extra_javascript:
  - javascripts/mathjax.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js

  extra_css:
  - stylesheets/extra.css

  exclude_docs: |
  drafts/