<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="820" viewBox="0 0 1400 820" role="img" aria-labelledby="title desc">
  <title id="title">A strong embedding of finite binary trees</title>
  <desc id="desc">The binary tree of height two is embedded into levels zero, two, and five of the full binary tree. The embedding stretches levels while preserving the left and right successor directions.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L12,6 L0,12 Z" fill="#334155"/>
    </marker>
    <style>
      .title { font: 600 34px Inter, Arial, sans-serif; fill: #0f172a; }
      .subtitle { font: 400 20px Inter, Arial, sans-serif; fill: #475569; }
      .panel { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2; rx: 18; }
      .panel-title { font: 600 24px Inter, Arial, sans-serif; fill: #0f172a; }
      .level { stroke: #cbd5e1; stroke-width: 1.5; stroke-dasharray: 6 7; }
      .level-label { font: 500 17px Inter, Arial, sans-serif; fill: #64748b; }
      .edge { fill: none; stroke: #64748b; stroke-width: 3; stroke-linecap: round; }
      .edge-left { stroke: #2563eb; }
      .edge-right { stroke: #ea580c; }
      .node { fill: #ffffff; stroke: #334155; stroke-width: 2.5; }
      .node-text { font: 500 18px 'STIX Two Text', 'Cambria Math', serif; fill: #0f172a; text-anchor: middle; dominant-baseline: middle; }
      .bit { font: 600 17px Inter, Arial, sans-serif; }
      .bit-left { fill: #2563eb; }
      .bit-right { fill: #ea580c; }
      .map { stroke: #334155; stroke-width: 3; marker-end: url(#arrow); }
      .map-label { font: italic 600 30px 'STIX Two Text', 'Cambria Math', serif; fill: #0f172a; text-anchor: middle; }
      .formula-box { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 1.5; rx: 14; }
      .formula { font: 500 23px 'STIX Two Text', 'Cambria Math', serif; fill: #0f172a; text-anchor: middle; }
      .caption { font: 500 19px Inter, Arial, sans-serif; fill: #334155; text-anchor: middle; }
    </style>
  </defs>

  <rect width="1400" height="820" fill="#f8fafc"/>
  <text x="700" y="52" class="title" text-anchor="middle">A strong embedding stretches levels, but preserves branching</text>
  <text x="700" y="84" class="subtitle" text-anchor="middle">A finite restriction of  e : 2<tspan baseline-shift="super" font-size="14">&lt;ω</tspan> → 2<tspan baseline-shift="super" font-size="14">&lt;ω</tspan></text>

  <!-- Source tree -->
  <rect x="55" y="120" width="500" height="540" class="panel"/>
  <text x="305" y="158" class="panel-title" text-anchor="middle">Source: 2<tspan baseline-shift="super" font-size="15">≤2</tspan></text>

  <line x1="105" y1="220" x2="505" y2="220" class="level"/>
  <line x1="105" y1="360" x2="505" y2="360" class="level"/>
  <line x1="105" y1="540" x2="505" y2="540" class="level"/>
  <text x="78" y="226" class="level-label">0</text>
  <text x="78" y="366" class="level-label">1</text>
  <text x="78" y="546" class="level-label">2</text>

  <path d="M305 240 L215 340" class="edge edge-left"/>
  <path d="M305 240 L395 340" class="edge edge-right"/>
  <path d="M215 380 L145 520" class="edge edge-left"/>
  <path d="M215 380 L255 520" class="edge edge-right"/>
  <path d="M395 380 L355 520" class="edge edge-left"/>
  <path d="M395 380 L465 520" class="edge edge-right"/>

  <text x="250" y="293" class="bit bit-left">0</text>
  <text x="360" y="293" class="bit bit-right">1</text>
  <text x="170" y="451" class="bit bit-left">0</text>
  <text x="246" y="451" class="bit bit-right">1</text>
  <text x="364" y="451" class="bit bit-left">0</text>
  <text x="440" y="451" class="bit bit-right">1</text>

  <circle cx="305" cy="220" r="21" class="node"/>
  <circle cx="215" cy="360" r="21" class="node"/>
  <circle cx="395" cy="360" r="21" class="node"/>
  <circle cx="145" cy="540" r="25" class="node"/>
  <circle cx="255" cy="540" r="25" class="node"/>
  <circle cx="355" cy="540" r="25" class="node"/>
  <circle cx="465" cy="540" r="25" class="node"/>
  <text x="305" y="220" class="node-text">∅</text>
  <text x="215" y="360" class="node-text">0</text>
  <text x="395" y="360" class="node-text">1</text>
  <text x="145" y="540" class="node-text">00</text>
  <text x="255" y="540" class="node-text">01</text>
  <text x="355" y="540" class="node-text">10</text>
  <text x="465" y="540" class="node-text">11</text>

  <!-- Embedding arrow -->
  <line x1="590" y1="390" x2="748" y2="390" class="map"/>
  <text x="665" y="367" class="map-label">e</text>
  <text x="670" y="428" class="caption">levels</text>
  <text x="670" y="455" class="caption">0 ↦ 0, 1 ↦ 2, 2 ↦ 5</text>

  <!-- Image tree -->
  <rect x="805" y="120" width="540" height="540" class="panel"/>
  <text x="1080" y="158" class="panel-title" text-anchor="middle">Image: e[2<tspan baseline-shift="super" font-size="15">≤2</tspan>]</text>

  <line x1="875" y1="220" x2="1315" y2="220" class="level"/>
  <line x1="875" y1="360" x2="1315" y2="360" class="level"/>
  <line x1="875" y1="540" x2="1315" y2="540" class="level"/>
  <text x="820" y="226" class="level-label">ℓ₀=0</text>
  <text x="820" y="366" class="level-label">ℓ₁=2</text>
  <text x="820" y="546" class="level-label">ℓ₂=5</text>

  <!-- Curved edges emphasize skipped ambient levels -->
  <path d="M1090 241 C1055 275 1015 305 980 339" class="edge edge-left"/>
  <path d="M1090 241 C1125 275 1185 305 1220 339" class="edge edge-right"/>
  <path d="M980 382 C949 424 915 472 900 515" class="edge edge-left"/>
  <path d="M980 382 C1008 426 1030 470 1040 515" class="edge edge-right"/>
  <path d="M1220 382 C1192 426 1170 470 1160 515" class="edge edge-left"/>
  <path d="M1220 382 C1251 424 1285 472 1300 515" class="edge edge-right"/>

  <text x="1028" y="292" class="bit bit-left">begins 0</text>
  <text x="1158" y="292" class="bit bit-right">begins 1</text>
  <text x="925" y="454" class="bit bit-left">0</text>
  <text x="1025" y="454" class="bit bit-right">1</text>
  <text x="1175" y="454" class="bit bit-left">0</text>
  <text x="1275" y="454" class="bit bit-right">1</text>

  <circle cx="1090" cy="220" r="21" class="node"/>
  <circle cx="980" cy="360" r="29" class="node"/>
  <circle cx="1220" cy="360" r="29" class="node"/>
  <circle cx="900" cy="540" r="40" class="node"/>
  <circle cx="1040" cy="540" r="40" class="node"/>
  <circle cx="1160" cy="540" r="40" class="node"/>
  <circle cx="1300" cy="540" r="40" class="node"/>
  <text x="1090" y="220" class="node-text">∅</text>
  <text x="980" y="360" class="node-text">00</text>
  <text x="1220" y="360" class="node-text">11</text>
  <text x="900" y="540" class="node-text">00000</text>
  <text x="1040" y="540" class="node-text">00110</text>
  <text x="1160" y="540" class="node-text">11001</text>
  <text x="1300" y="540" class="node-text">11110</text>

  <!-- Defining property -->
  <rect x="150" y="700" width="1100" height="78" class="formula-box"/>
  <text x="700" y="733" class="formula">e sends level k to level ℓₖ,   and   e(s⌢i) ⊒ e(s)⌢i</text>
  <text x="700" y="760" class="caption">Blue = left successor (i=0)   •   Orange = right successor (i=1)</text>
</svg>
