<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="680" viewBox="0 0 1400 680" role="img" aria-labelledby="title desc">
  <title id="title">The two abstract splitting patterns for triples</title>
  <desc id="desc">Two upward-growing binary trees of height three. In the left tree the close pair is on the right. In the right tree the close pair is on the left.</desc>
  <defs>
    <style>
      .background { fill: #ffffff; }
      .guide { stroke: #d6dbe3; stroke-width: 1.5; stroke-dasharray: 7 8; }
      .edge { stroke: #26364a; stroke-width: 5; stroke-linecap: round; }
      .node { fill: #ffffff; stroke: #26364a; stroke-width: 3.5; }
      .split { fill: #f59e0b; stroke: #8a4b08; stroke-width: 3.5; }
      .terminal { fill: #2563eb; stroke: #173e8f; stroke-width: 3.5; }
      .level { font: 20px Georgia, serif; fill: #526174; }
      .label { font: 23px Georgia, serif; fill: #26364a; }
      .panel { font: 25px Georgia, serif; fill: #526174; }
    </style>
  </defs>

  <rect class="background" width="1400" height="680"/>

  <!-- Common levels for both height-three trees. -->
  <line class="guide" x1="135" y1="555" x2="1340" y2="555"/>
  <line class="guide" x1="135" y1="350" x2="1340" y2="350"/>
  <line class="guide" x1="135" y1="145" x2="1340" y2="145"/>
  <text class="level" x="115" y="562" text-anchor="end">level 0</text>
  <text class="level" x="115" y="357" text-anchor="end">level 1</text>
  <text class="level" x="115" y="152" text-anchor="end">level 2</text>

  <!-- Left panel: close pair on the right. -->
  <text class="panel" x="430" y="65" text-anchor="middle">close pair on the right</text>
  <line class="edge" x1="430" y1="555" x2="245" y2="350"/>
  <line class="edge" x1="430" y1="555" x2="585" y2="350"/>
  <line class="edge" x1="245" y1="350" x2="245" y2="145"/>
  <line class="edge" x1="585" y1="350" x2="505" y2="145"/>
  <line class="edge" x1="585" y1="350" x2="665" y2="145"/>

  <circle class="split" cx="430" cy="555" r="12"/>
  <circle class="node" cx="245" cy="350" r="10"/>
  <circle class="split" cx="585" cy="350" r="12"/>
  <circle class="terminal" cx="245" cy="145" r="13"/>
  <circle class="terminal" cx="505" cy="145" r="13"/>
  <circle class="terminal" cx="665" cy="145" r="13"/>

  <text class="label" x="245" y="112" text-anchor="middle">0</text>
  <text class="label" x="505" y="112" text-anchor="middle">1</text>
  <text class="label" x="665" y="112" text-anchor="middle">2</text>

  <!-- Right panel: close pair on the left. -->
  <text class="panel" x="1020" y="65" text-anchor="middle">close pair on the left</text>
  <line class="edge" x1="1020" y1="555" x2="865" y2="350"/>
  <line class="edge" x1="1020" y1="555" x2="1205" y2="350"/>
  <line class="edge" x1="865" y1="350" x2="785" y2="145"/>
  <line class="edge" x1="865" y1="350" x2="945" y2="145"/>
  <line class="edge" x1="1205" y1="350" x2="1205" y2="145"/>

  <circle class="split" cx="1020" cy="555" r="12"/>
  <circle class="split" cx="865" cy="350" r="12"/>
  <circle class="node" cx="1205" cy="350" r="10"/>
  <circle class="terminal" cx="785" cy="145" r="13"/>
  <circle class="terminal" cx="945" cy="145" r="13"/>
  <circle class="terminal" cx="1205" cy="145" r="13"/>

  <text class="label" x="785" y="112" text-anchor="middle">0</text>
  <text class="label" x="945" y="112" text-anchor="middle">1</text>
  <text class="label" x="1205" y="112" text-anchor="middle">2</text>
</svg>
