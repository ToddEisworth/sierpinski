<svg xmlns="http://www.w3.org/2000/svg" width="900" height="620" viewBox="0 0 900 620" role="img" aria-labelledby="title desc">
  <title id="title">Abstract splitting pattern of a triple</title>
  <desc id="desc">An upward-growing binary tree of height three. The left branch continues without splitting, while the right branch splits into the close pair.</desc>
  <defs>
    <style>
      .background { fill: #ffffff; }
      .guide { stroke: #d6dbe3; stroke-width: 1.5; stroke-dasharray: 7 8; }
      .edge { stroke: #26364a; stroke-width: 5; stroke-linecap: round; }
      .node { fill: #ffffff; stroke: #26364a; stroke-width: 3.5; }
      .split { fill: #f59e0b; stroke: #8a4b08; stroke-width: 3.5; }
      .terminal { fill: #2563eb; stroke: #173e8f; stroke-width: 3.5; }
      .level { font: 20px Georgia, serif; fill: #526174; }
      .label { font: 23px Georgia, serif; fill: #26364a; }
      .caption { font: italic 21px Georgia, serif; fill: #526174; }
    </style>
  </defs>

  <rect class="background" width="900" height="620"/>

  <!-- The three levels of the abstract tree. -->
  <line class="guide" x1="135" y1="500" x2="805" y2="500"/>
  <line class="guide" x1="135" y1="315" x2="805" y2="315"/>
  <line class="guide" x1="135" y1="130" x2="805" y2="130"/>
  <text class="level" x="115" y="507" text-anchor="end">level 0</text>
  <text class="level" x="115" y="322" text-anchor="end">level 1</text>
  <text class="level" x="115" y="137" text-anchor="end">level 2</text>

  <!-- Edges: the tree grows upward. -->
  <line class="edge" x1="450" y1="500" x2="260" y2="315"/>
  <line class="edge" x1="450" y1="500" x2="610" y2="315"/>
  <line class="edge" x1="260" y1="315" x2="260" y2="130"/>
  <line class="edge" x1="610" y1="315" x2="530" y2="130"/>
  <line class="edge" x1="610" y1="315" x2="690" y2="130"/>

  <!-- Every node is shown; the node at level 1 on the left is non-branching. -->
  <circle class="split" cx="450" cy="500" r="12"/>
  <circle class="node" cx="260" cy="315" r="10"/>
  <circle class="split" cx="610" cy="315" r="12"/>
  <circle class="terminal" cx="260" cy="130" r="13"/>
  <circle class="terminal" cx="530" cy="130" r="13"/>
  <circle class="terminal" cx="690" cy="130" r="13"/>

  <text class="label" x="260" y="94" text-anchor="middle">0</text>
  <text class="label" x="530" y="94" text-anchor="middle">1</text>
  <text class="label" x="690" y="94" text-anchor="middle">2</text>
  <text class="caption" x="610" y="54" text-anchor="middle">close pair</text>
</svg>
